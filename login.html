<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Entrar – Cronograma MecRoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fdf0e3 0%,#fce9d6 50%,#fbe3c9 100%);
  padding:24px;
}
.login-card{
  display:flex;
  width:100%;max-width:1180px;
  min-height:700px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.12);
}

/* ---------- LADO ESQUERDO ---------- */
.side{
  flex:1;
  background:#2e7d32;
  background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
  background-size:18px 18px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:56px 48px;
  text-align:center;
}
.side-icon{
  width:168px;height:168px;
  background:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 32px rgba(0,0,0,.16);
  margin-bottom:34px;
}
.side-icon i{font-size:70px;color:#2e7d32}
.side-logo{
  background:#000;
  padding:6px 10px;
  border-radius:4px;
  margin-bottom:26px;
  display:inline-flex;
}
.side-logo img{height:34px;object-fit:contain;display:block}
.side h1{
  font-size:30px;font-weight:800;color:#fff;
  letter-spacing:-.5px;margin-bottom:14px;line-height:1.15;
}
.side p{
  font-size:14px;color:rgba(255,255,255,.88);
  line-height:1.65;max-width:330px;
}

/* ---------- LADO DIREITO ---------- */
.form-side{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:56px 64px;
}
.form-wrap{width:100%;max-width:400px}
.form-wrap h2{
  font-size:34px;font-weight:800;color:#1a1a2e;
  letter-spacing:-.7px;margin-bottom:8px;
}
.form-wrap .sub{
  font-size:15px;color:#5a6b8c;margin-bottom:38px;
}
.field{margin-bottom:22px}
.field label{
  display:block;
  font-size:13px;font-weight:600;color:#1a1a2e;
  margin-bottom:8px;
}
.input-wrap{position:relative}
.field input{
  width:100%;
  padding:15px 18px;
  border:1px solid #e3e8f0;
  border-radius:10px;
  font-size:14px;font-family:inherit;color:#1a1a2e;
  background:#f8fafc;
  outline:none;
  transition:border-color .18s, box-shadow .18s, background .18s;
}
.field input::placeholder{color:#9aa8c0}
.field input:focus{
  border-color:#2e7d32;background:#fff;
  box-shadow:0 0 0 3px rgba(46,125,50,.11);
}
.toggle-pw{
  position:absolute;right:14px;top:50%;
  transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:#9aa8c0;font-size:15px;padding:6px;
  display:flex;align-items:center;
}
.toggle-pw:hover{color:#5a6b8c}

.btn-entrar{
  width:100%;
  padding:16px;
  background:#1a1a2e;color:#fff;
  border:none;border-radius:10px;
  font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background .18s, transform .18s, box-shadow .18s;
  margin-top:32px;
}
.btn-entrar:hover:not(:disabled){
  background:#12121f;transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(26,26,46,.26);
}
.btn-entrar:disabled{opacity:.6;cursor:not-allowed}

.link-senha{
  display:block;text-align:center;
  margin-top:20px;
  font-size:13.5px;font-weight:600;
  color:#2563eb;text-decoration:none;
}
.link-senha:hover{text-decoration:underline}

.msg{
  margin-top:20px;padding:13px 16px;
  border-radius:9px;font-size:13px;
  display:none;line-height:1.5;
}
.msg.show{display:block}
.msg.error{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.msg.success{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.msg.info{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}

@media (max-width:900px){
  body{padding:0;background:#fff}
  .login-card{
    flex-direction:column;min-height:100vh;
    border-radius:0;box-shadow:none;max-width:none;
  }
  .side{padding:44px 28px;flex:0 0 auto}
  .side-icon{width:110px;height:110px;margin-bottom:22px}
  .side-icon i{font-size:46px}
  .side h1{font-size:23px}
  .side p{font-size:13px}
  .form-side{padding:40px 26px}
  .form-wrap h2{font-size:27px}
}
</style>
</head>

    <h1>Cronograma de Atividades</h1>
    <p>Planejamento de campo, equipes e prazos — tudo em um só lugar.</p>
  </div>

  <!-- ===== LADO DIREITO ===== -->
  <div class="form-side">
    <div class="form-wrap">
      <h2>Bem-vindo</h2>
      <div class="sub">Acesse sua conta para continuar</div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seunome@mecroc.com.br" autocomplete="username"/>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password"/>
          <button class="toggle-pw" id="togglePw" type="button" title="Mostrar senha">
            <i class="fas fa-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <button class="btn-entrar" id="btnEntrar">
        Entrar <i class="fas fa-arrow-right"></i>
      </button>

      <a href="#" class="link-senha" id="linkSenha">Esqueci minha senha</a>

      <div class="msg" id="msg"></div>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);

function showMsg(texto, tipo) {
  const el = $('msg');
  el.textContent = texto;
  el.className = 'msg show ' + (tipo || 'info');
}
function hideMsg() {
  $('msg').className = 'msg';
}

// ---- Mostrar / ocultar senha ----
$('togglePw').addEventListener('click', () => {
  const inp = $('senha');
  const icon = $('pwIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
});

// ---- Se já estiver logado, vai direto pro app ----
(async () => {
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data?.session) window.location.href = 'Cronograma_MecRoc.html';
  } catch (e) {
    console.error('Erro ao verificar sessão:', e);
  }
})();

// ---- Entrar ----
async function fazerLogin() {
  const email = $('email').value.trim();
  const senha = $('senha').value;

  if (!email)  { showMsg('Informe seu e-mail.', 'error'); $('email').focus(); return; }
  if (!senha)  { showMsg('Informe sua senha.', 'error'); $('senha').focus(); return; }

  const btn = $('btnEntrar');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
  hideMsg();

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha,
    });

    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('invalid login credentials')) {
        showMsg('E-mail ou senha incorretos.', 'error');
      } else if (m.includes('email not confirmed')) {
        showMsg('E-mail ainda não confirmado. Procure o administrador.', 'error');
      } else {
        showMsg('Erro ao entrar: ' + error.message, 'error');
      }
      btn.disabled = false;
      btn.innerHTML = original;
      return;
    }

    showMsg('Login efetuado! Redirecionando...', 'success');
    setTimeout(() => { window.location.href = 'Cronograma_MecRoc.html'; }, 500);

  } catch (e) {
    showMsg('Falha de conexão. Verifique sua internet.', 'error');
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

$('btnEntrar').addEventListener('click', fazerLogin);

// Enter envia o formulário
['email', 'senha'].forEach(id => {
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') fazerLogin();
  });
});

// ---- Esqueci minha senha ----
$('linkSenha').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();

  if (!email) {
    showMsg('Digite seu e-mail no campo acima e clique aqui novamente.', 'info');
    $('email').focus();
    return;
  }

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/redefinir-senha.html',
    });
    if (error) {
      showMsg('Erro ao enviar: ' + error.message, 'error');
    } else {
      showMsg('Link de redefinição enviado para ' + email + '. Verifique também a caixa de spam.', 'success');
    }
  } catch (err) {
    showMsg('Falha de conexão ao enviar o e-mail.', 'error');
  }
});

$('email').focus();
</script>
